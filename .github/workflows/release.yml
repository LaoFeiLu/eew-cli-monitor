name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Extract short commit SHA
        id: vars
        run: |
          $sha = "$env:GITHUB_SHA".Substring(0, 5)
          echo "commit_short=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --add-data "sounds;sounds" --name "${{ env.commit_short }}-eew-cli-monitor" eew-cli-monitor.py

      - name: Prepare release assets
        run: |
          New-Item -ItemType Directory -Path release_assets -Force
          Copy-Item "dist/${{ env.commit_short }}-eew-cli-monitor.exe" -Destination release_assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          tag_name: ${{ github.event.inputs.tag }}
          generate_release_notes: true
