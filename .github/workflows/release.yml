name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller nuitka
          choco install upx -y

      - name: Extract short commit SHA
        id: vars
        run: |
          $sha = "$env:GITHUB_SHA".Substring(0, 5)
          echo "commit_short=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile ^
            --add-data "sounds;sounds" ^
            --strip ^
            --upx-dir "C:\ProgramData\chocolatey\lib\upx\tools" ^
            --exclude-module tkinter ^
            --exclude-module test ^
            --exclude-module unittest ^
            --exclude-module pydoc ^
            --exclude-module xmlrpc ^
            --exclude-module lib2to3 ^
            --exclude-module http.server ^
            --exclude-module sqlite3 ^
            --name "${{ env.commit_short }}-pyinstaller" ^
            eew-cli-monitor.py

      - name: Build with Nuitka
        run: |
          python -m nuitka --onefile --standalone ^
            --mingw64 ^
            --include-data-dir=sounds=sounds ^
            --output-filename="${{ env.commit_short }}-nuitka.exe" ^
            --output-dir=dist ^
            eew-cli-monitor.py

      - name: Prepare release assets
        run: |
          New-Item -ItemType Directory -Path release_assets -Force
          Copy-Item "dist/${{ env.commit_short }}-pyinstaller.exe" -Destination "release_assets/${{ env.commit_short }}-eew-cli-monitor-pyinstaller.exe"
          Copy-Item "dist/${{ env.commit_short }}-nuitka.exe" -Destination "release_assets/${{ env.commit_short }}-eew-cli-monitor-nuitka.exe"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          tag_name: ${{ github.event.inputs.tag }}
          generate_release_notes: true
